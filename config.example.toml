# baton's configuration. Copy this file to config.toml next to it and edit that copy: the runner
# reads config.toml (or --config PATH). Only Cursor role overrides are optional; `python -m baton --validate` checks
# the file without starting anything. A leading ~/ is the runner's home; relative paths are
# from this file's directory.

[paths]
# Runner-wide roots. Each repository gets OWNER/NAME below clones, wt_root, state/repos, logs and ctx;
# quota, vendor cooldowns, run counts, telemetry and runner.log stay global. A tick locks one
# repository at a time (state/repos/OWNER/NAME/lock), so ticks for different repositories may overlap.
# Where the runner is installed (this checkout). Informational: nothing reads it yet.
agent_home = "~/baton"
# Each repository's clone, at clones/OWNER/NAME. Clone it there yourself before the first tick.
clones = "~/baton/repos"
# The agents' git worktrees, one per issue or PR, under wt_root/OWNER/NAME.
wt_root = "~/baton/worktrees"
# Checkpoints, cooldowns, quota snapshots, run counts and the telemetry ledger.
state = "~/.local/state/baton"
# runner.log and one log per agent run.
logs = "~/.local/state/baton/logs"
# The context files given to agents (issue, comments, diffs); removed after 14 days.
ctx = "~/.local/state/baton/ctx"
# The scripts, prompts and agent settings this checkout ships.
self_dir = "bin"
# The Matt skills plugin, if Claude Code has it; its newest version is used. A missing directory
# is fine: large reviews then run in one pass instead of through its code-review skill.
matt_skills_root = "~/.claude/plugins/cache/mattpocock/mattpocock-skills"

[scheduling]
# Merge an agent PR whose review passed, CI is green and "## Checks to verify" is none (or the screenshot review verified every check). false: every
# PR waits for the owner. A repository can also turn it off for itself ([[repos]] auto_merge).
auto_merge = true
# Per repository: no new issue starts while this many agent PRs are still in the review loop
# (a PR handed to the owner, ready-for-human, doesn't count). A PR whose next step is deferred for
# vendor quota or cooldown lends its slot, so at most max_pending_prs + 1 issues are in flight.
# Each repository's queue is ordered by the issue labels P0, P1, P2, P3 (none ranks as P2), then by
# issue number, and PR work goes before new issues. P0 is the exception to both: it goes before
# lower-priority PR work and starts even at max_pending_prs.
max_pending_prs = 1
# Reviews per PR before it goes to the owner; each review but the last can be followed by a fix.
max_review_rounds = 2
# Fix runs after the pre-push checks (verify_hook or ci_command) fail, before giving up unpushed.
max_verify_fixes = 2
# How long a vendor rests after a quota limit with no reset time, or after an auth failure.
cooldown_hours = 5
# A diff over this many lines is reviewed through the Matt skills' code-review skill, when present.
review_skill_min_lines = 800
# Passes one tick may chain (an item that ends hands straight to the next).
chain_max = 5
# The most characters of PR comments and reviews given to a reviewer or fixer as context.
review_context_max_chars = 20000
# true: the timer's ticks do nothing and `serve` starts nothing; runs by hand still work.
paused = false
# `python -m baton serve` only: tick children it runs at once across all repositories, never two for
# one repository. Optional, at least 1. Raise it only when the repositories' CI and e2e commands do
# not collide on ports or container names. Lowering it never stops a running child.
max_parallel = 1
# Cursor triages claude-found issues (its verdicts advance them), and code scans may run.
cross_review = true
# Who Cursor is on GitHub: PR author logins and branch names that mark a Cursor PR.
cursor_login_re = "^(app/cursor|cursor(\\[bot\\])?)$"
cursor_branch_re = "^cursor/"
# Spec review rounds before an issue goes to the owner; an owner answer earns one more.
max_spec_rounds = 3
# When there is nothing else to do, Claude scans one of a repository's scan_areas for bugs and
# files what it finds as claude-found + needs-triage issues. Needs cross_review.
scan = false
# Hours between two scans.
scan_interval_hours = 6
# No new scan while this many claude-found issues still wait for triage.
scan_max_waiting = 2

# Optional: the resident supervisor, `python -m baton serve`, which replaces baton.timer. It reads
# this whole file again on every loop; while the file is invalid it starts nothing.
[serve]
# Seconds between its loops, and how long a finished or idle repository waits before its next tick.
# A failing one waits twice as long each time, up to an hour. At least 10.
poll_seconds = 60

[[repos]]
# A repository the runner works on, one [[repos]] entry each; the runner takes them in turn.
# Its conventions (tests, CI, commit style) are in its own AGENTS.md. This entry is an example:
# replace it with your own.
gh_repo = "acme/app"
# The GitHub login the runner works for. External issues need this account's ready-for-agent
# label event; other accounts' labels do not authorize work. Only this owner's comments count
# as human answers and fix feedback. The configured Cursor accounts can also supply agent context.
owner = "acme-owner"
# Issues the runner takes need this milestone ("" for any); claude-found ones need none.
agent_milestone = ""
# CI check names an agent may try to fix when they fail on its PR.
ci_fixable_checks = ["test", "lint"]
# What the code scan (scheduling.scan) reviews, one area per run: space-separated directories.
scan_areas = ["web/src", "api"]
# Plain env files copied into each worktree, laid out as in the repository; "" for none.
env_files = "~/.config/baton/env-files/acme/app"
# The secret_env_keys are read from this file for the runs that write code (dev, fix) only.
secret_env_file = "~/.config/baton/env-files/acme/app/.secrets"
# The KEY=value names taken from secret_env_file (a missing file gives none).
secret_env_keys = []
# Name prefixes the repository's own tests give their /tmp files (myapp for /tmp/myapp-*-test.db).
# bin/tmp-sweep.sh removes them as it does the runner's baton-* files: a finished issue's
# PREFIX-N-* at once, and anything untouched for a day.
tmp_prefixes = []
# What agents run before they finish; {base} is the branch point (origin/main, or a commit).
ci_command = "make check BASE={base}"
# A directory whose same-named *-prompt.md files replace the shipped ones; "" for none.
prompt_dir = ""
# Hooks: commands on this host, never in the repository, so an agent's branch can't rewrite the
# checks that judge it. Relative paths are from this file's directory; "" for none.
# verify WORKTREE BASE: the checks before every push (none: ci_command in the worktree). It gets
#   CI_COMMAND and E2E_GATE in its environment. It and the gate hook also get VERIFY_ARTIFACTS, a
#   directory beside the attempt's log for test output (traces, screenshots); a failed attempt
#   keeps what they wrote there, a passing one doesn't.
verify_hook = ""
# e2e WORKTREE [args]: how agents run e2e themselves, {{E2E_HOOK}} in prompt_notes.
e2e_hook = ""
# gate WORKTREE ARGS: the issue's `## E2E gate` line, after green checks; its last output line is
# the result posted on the PR. None: issues have no gate.
gate_hook = ""
# nightly WORKTREE: once a night on origin/main; exit 0 is green, its last line the summary.
nightly_hook = ""
# What a gate line may hold: targets, each matching gate_target, then options matching gate_option.
# Both are needed with a gate_hook, such as 'e2e/[A-Za-z0-9_-]+\.spec\.ts' and '--repeat-each=([1-9]|10)'.
gate_target = ""
gate_option = ""
# true when the repository requires a Signed-off-by on every commit (a DCO check): before each
# push the runner adds one for the author to the agent's unpushed commits that lack it.
signoff = false
# true: after a successful code review of an agent PR with manual checks, a separate
# screenshot review run (models.routes.screenshot_review, preferences.screenshot_reviewer) looks
# at the manual-check screenshots: Must fix for anything a user would see as broken, or for
# missing screenshots. Every fixer re-shoots them. Owner PRs skip it.
# It also gives each manual check a verdict (ADR 0006): verified, broken or owner. When the last
# round verified them all, the PR merges like one with no manual checks (the screenshots still
# go to Telegram); otherwise only the checks left for the owner are handed over.
# Checks the owner wrote into the issue are judged the same way.
screenshot_review = false
# false: every PR of this repository waits for the owner (ready-for-human), even when
# [scheduling].auto_merge is true. Use it for a repository whose changes you merge yourself.
auto_merge = true
# Integer ≥ 1 (default 1). Under baton serve, when free slots are contended, equal-priority
# candidates across repositories: higher weight starts first, then rotation. Priority always
# beats it. It does not expire; set it back to 1 to stop favouring a project. It does not change
# quota or vendor choice, and has no effect without contention, on the legacy timer path, or
# inside a child's own next_issue().
weight = 1
# Globs relative to the repository root (* also matches /). A PR that touches one, under its old
# or new name, waits for the owner after review and CI pass, even with auto_merge on; no advisor
# may release it. List the files that decide what agents may do (guard, quota, merge rules).
owner_review_paths = []
# false: the advisor is never called for this repository (its issue and PR text stay on the host).
advisor = true
# Opt-in raw excerpts the routine advisor may receive as citation evidence. Each defaults to
# false; advisor = true alone permits only the baseline snapshot (issue/PR metadata, trusted
# feedback, diff size, CI status). No flag overrides a global advisor mode of off, or
# advisor = false on this repository. Redaction and snapshot_chars still apply to every field.
advisor_diff_excerpts = false
advisor_ci_log_excerpts = false
advisor_local_documents = false
# Intake task profiles (ADR 0009): subject lines of main's newest commits for the paths an issue
# names, redacted and capped. Never authors, committers, message bodies or trailers.
advisor_commit_subjects = false

[repos.areas]
# Top-level directory -> area, for per-area vendor preferences (`dev_ui = [...]`). Anything else is "other".
web = "ui"
api = "api"

[repos.env]
# Plain variables for the agents' tools; a leading ~/ expands to the runner's home.

[repos.prompt_notes]
# Text for a template's {{REPO_NOTES}} line, by template name (dev = dev-prompt.md). The repo's
# conventions belong in its AGENTS.md; these are only what the runner on this host adds.

[models]
# Roles: dev (implement an issue), fix (answer a review or CI failure), review (review a PR),
# spec_review (review an issue before work starts), spec (revise the issue after that review),
# scan (look for bugs in one area). "_followup" models run the later rounds of review,
# spec_review and spec, when the first round's findings only need checking.
#
# Claude Code: --max-budget-usd per run, by role (Claude Code's own estimate at API prices).
budget_dev = 10
budget_fix = 5
budget_review = 4
budget_screenshot_review = 4
budget_spec_review = 3
budget_spec = 3
budget_scan = 3
# How long a vendor rests when its fallback model is full too.
busy_minutes = 30

[models.aliases]
claude_strong = "opus"
claude_fast = "sonnet"
claude_probe = "haiku"
codex_fast = "gpt-6.2-sol"
codex_strong = "gpt-6.2-astra"
codex_prev = "gpt-6.1-sol"
codex_terra = "gpt-6.1-terra"
cursor_auto = "auto"
cursor_analyst = "grok-4.7-high"

# A follow-up entry replaces its vendor's base entry. Omitted vendors inherit the base.
# Optional effort goes to Codex or Claude (Cursor model IDs carry their own). A first round
# steers the rest, so it gets more effort than a follow-up that re-checks earlier points (#63).
# Only Claude accepts subagent_model.

[models.routes.dev]
claude = { model = "claude_fast", effort = "medium" }
codex = { model = "codex_fast", effort = "medium" }
cursor = { model = "cursor_auto" }

[models.routes.fix]
claude = { model = "claude_fast", effort = "medium" }
codex = { model = "codex_fast", effort = "medium" }
cursor = { model = "cursor_auto" }

[models.routes.review]
claude = { model = "claude_strong", subagent_model = "claude_fast", effort = "high" }
codex = { model = "codex_strong", effort = "high" }
cursor = { model = "cursor_auto" }

[models.routes.screenshot_review]
claude = { model = "claude_strong", effort = "low" }
codex = { model = "codex_terra", effort = "low" }

[models.routes.spec_review]
claude = { model = "claude_strong", effort = "high" }
codex = { model = "codex_strong", effort = "high" }
cursor = { model = "cursor_auto" }

[models.routes.spec]
claude = { model = "claude_strong", effort = "medium" }
codex = { model = "codex_fast", effort = "medium" }

[models.routes.scan]
claude = { model = "claude_fast", effort = "low" }

[models.routes.review_followup]
claude = { model = "claude_fast", subagent_model = "claude_fast", effort = "low" }
codex = { model = "codex_fast", effort = "low" }

[models.routes.spec_review_followup]
claude = { model = "claude_fast", effort = "low" }
codex = { model = "codex_fast", effort = "low" }

[models.routes.spec_followup]
claude = { model = "claude_fast", effort = "low" }

# Optional route tiers (ADR 0009) for dev, fix, review, spec_review and spec: <role> is the standard
# tier, <role>_light and <role>_heavy replace a vendor's whole base entry for a step of that tier.
# Omitted vendors inherit the base. Follow-up runs ignore the tier. Same-vendor eligibility is
# judged from the tier's model (a code review of the vendor's own work may swap in another of its
# models), and agy review models must differ from its write models in every tier. Nothing sets a non-standard tier yet. Examples:
# [models.routes.dev_light]
# claude = { model = "claude_fast", effort = "low" }
#
# [models.routes.fix_heavy]
# claude = { model = "claude_strong", effort = "high" }

# reviser is open to any declared vendor (pool or extra) whose roles include it; a grant still
# needs a base [models.routes.spec] entry for that vendor. The baseline leaves cursor without
# reviser; an optional extra such as agy may add it when its adapter supports the role.
[vendors.claude]
adapter = "claude"
roles = ["dev", "fixer", "reviewer", "screenshot_reviewer", "spec_reviewer", "reviser", "retrospective", "scan"]
quota = "pool"
cap = 0.90
max_minutes = 150
fallback_models = ["claude_fast", "claude_strong"]
quota_probe_model = "claude_probe"
# Optional override of [quota] quota_five_hour_max for this vendor's 5-hour window (same fraction
# rules as cap). Omit to use the global default. Only vendors that report a 5-hour window are gated.
# five_hour_max = 1.0
# Optional unattended login: CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`) comes from the
# runner's environment, else this file, which only its owner may read (chmod 600). Only the claude
# processes baton starts get it; without it Claude uses its stored /login credential.
# env_file = "~/.config/baton/claude.env"   # CLAUDE_CODE_OAUTH_TOKEN

[vendors.codex]
adapter = "codex"
roles = ["dev", "fixer", "reviewer", "screenshot_reviewer", "spec_reviewer", "reviser", "retrospective"]
quota = "pool"
cap = 0.95
max_minutes = 60
fallback_models = ["codex_prev", "codex_strong"]
cache_dirs = ["~/.local/share/pnpm", "~/.local/state/pnpm", "~/.cache/pnpm", "~/.cache/node/corepack", "~/.cache/node-compile-cache", "~/.cache/ms-playwright", "~/.cache/go-build", "~/go/pkg/mod", "~/.cache/go-tmp", "~/.cache/uv"]
# Optional: same fraction rules as cap; falls back to [quota] quota_five_hour_max when omitted.
# five_hour_max = 1.0

[vendors.cursor]
adapter = "cursor"
roles = ["dev", "fixer", "reviewer", "spec_reviewer", "retrospective"]
quota = "extra"
cap = 0.95
max_minutes = 60
# Optional: accepted and stored, but Cursor reports only a weekly window today, so the 5-hour gate
# does not apply to admission.
# five_hour_max = 1.0

[quota]
# Default 5-hour gate for vendors that report a 5-hour window and omit vendors.<id>.five_hour_max.
quota_five_hour_max = 0.9
# A quota snapshot older than this is refreshed (by a one-turn probe run) before a pick relies on it.
quota_stale_minutes = 30
# Independent quota worker retries incomplete probes with exponential backoff.
quota_probe_retry_minutes = 5
quota_probe_max_retry_minutes = 60
# Same-vendor review (of a vendor's own code, or Claude revising Claude's spec) runs only when
# every other vendor is blocked for the long term: weekly cap, expired credential, or a cooldown ending
# later than this. A vendor back sooner (5-hour window, short cooldown) is waited for (ADR 0002).
same_vendor_wait_max_minutes = 360

[preferences]
# Vendor order by role, used only to break ties between vendors that may run (cooldowns, quota
# caps and "the reviewer is not the author" filter first). Roles: dev, reviewer, fixer,
# screenshot_reviewer (claude or codex only; omitted: the reviewer order), spec_reviewer, reviser;
# ROLE_AREA (dev_ui) for one of the repos.areas. Vendors not listed can still be picked. An empty
# table keeps the plain quota order.
dev = ["cursor", "codex", "claude"]
reviewer = ["claude", "codex"]

[environment]
# What the agents' tools get. Each key below becomes the variable of the same name in upper case
# (npm_config_store_dir as is); "" leaves the variable out.
#
# Put first on PATH, before the runner's own.
path_prefix = ["~/.local/share/mise/shims", "~/.local/bin"]
# Host settings, "" for none: a CA bundle for OpenSSL, curl, git and Go (SSL_CERT_FILE and
# GIT_SSL_CAINFO), extra CAs for Node (NODE_EXTRA_CA_CERTS) and a Go module proxy (GOPROXY).
ssl_cert_file = ""
node_extra_ca_certs = ""
goproxy = ""
# false: corepack downloads a package manager without asking (COREPACK_ENABLE_DOWNLOAD_PROMPT=0).
corepack_enable_download_prompt = false
# Go and pnpm caches outside /tmp, shared by every worktree (also in vendors.codex.cache_dirs).
gocache = "~/.cache/go-build"
gomodcache = "~/go/pkg/mod"
gotmpdir = "~/.cache/go-tmp"
npm_config_store_dir = "~/.local/share/pnpm/store"
node_compile_cache = "~/.cache/node-compile-cache"
# Claude Code: the context size at which it compacts the conversation.
claude_code_auto_compact_window = 200000
# Claude Code: false keeps the MCP servers of your claude.ai account out of the agents' runs.
enable_claudeai_mcp_servers = false

# Optional integrations, none by default. Each key comes from the runner's environment or from
# env_file, which only its owner may read (chmod 600); no tool inherits them. Claude's setup-token
# file is [vendors.claude] env_file above.
#
# [linear]                  owner actions ("## Before release") become Linear issues, else a GitHub issue
# env_file = "~/.config/baton/linear.env"     # LINEAR_API_KEY
# team_id = ""
# project_id = ""
# label_id = ""
# assignee_id = ""
#
# [telegram]                notifications go to this chat as well as runner.log
# env_file = "~/.config/baton/telegram.env"   # TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID

# Optional evidence analysis: share review quota/preference policy, restricted to Opus/Sol/Grok 4.7.
# Declared [vendors.*] tables determine which CLI vendors are enabled and which roles they run.
# An adapter declares what a role can use (its supported roles, analyst command, approved model
# family, environment and budget enforcement); a vendor's `roles` grant picks which of them run.
# model_claude, model_codex and model_cursor are the only model settings: an adapter without
# one uses its built-in alias, resolved through the alias table (an unknown alias is an error).
# preferences.retrospective overrides preferences.reviewer for this role (otherwise reused).
[retrospectives]
enabled = false
# Deprecated opt-in only when enabled is absent. Never used as a requested model.
model = ""
model_claude = "claude_strong"
model_codex = "codex_fast"
model_cursor = "cursor_analyst"
effort = "high"
paused = false
settle_seconds = 300
daily_calls = 3
revision_attempts = 2
timeout_seconds = 600
input_chars = 20000
output_chars = 20000
budget_usd = 1.0

# Optional routine advisor (ADR 0008): "off" makes no call. "observe" records advice and runs the
# existing rule. "live" allows one extra review or spec round per task episode and at most one
# retry per failure reason per episode. Failed review, fix, spec, implementation, verification
# and worktree steps send redacted context for retry_step or retry_step_other_vendor when
# eligible. Verification retains its repair budget. CI and merge
# recommendations for implementation and ADR PRs stay in observation in either enabled mode.
# Complete, cited grounded answers to SPEC: human questions may resume revision in live mode.
# Decisions go to STATE/advisor/decisions.jsonl and a daily digest. A [[repos]] entry with
# advisor = false keeps that repository's text off both providers. Per-repository excerpt flags
# (advisor_diff_excerpts, advisor_ci_log_excerpts, advisor_local_documents,
# advisor_commit_subjects) default off. Either enabled mode also records an intake task profile
# per issue, in observation only (ADR 0009).
[advisor]
env_file = "~/.config/baton/deepseek.env"     # DEEPSEEK_API_KEY
# Backends, tried in order: "claude" (Claude Code, the grant for the advisor; Claude must be
# declared under [vendors]) and "deepseek". ["deepseek"] uses DeepSeek only.
backend_order = ["claude", "deepseek"]
claude = { model = "claude_strong", effort = "medium" }   # model alias and effort for Claude
mode = "off"
model = "deepseek-flash"                      # the DeepSeek model
base_url = "https://api.deepseek.com"
timeout_seconds = 60
snapshot_chars = 24000
