apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The dashboard as a ConfigMap for the Grafana dashboard sidecar (the label
# kube-prometheus-stack watches). Include this directory as a kustomize resource;
# outside Kubernetes, import dashboard.json directly.
configMapGenerator:
  - name: grafana-dashboard-baton
    files:
      - baton.json=dashboard.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
