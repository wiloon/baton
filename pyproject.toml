# Standard library only at run time. The systemd units use `uv run --frozen --no-dev`.
# Run from a checkout: this is not a distributable Python package.
[project]
name = "baton"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = ["pytest>=9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
