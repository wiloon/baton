# Standard library only at run time. The systemd units use `uv run --frozen --no-dev`.
# Run from a checkout: this is not a distributable Python package.
[project]
name = "baton"
# Required by uv, read by nothing. A release is a git tag (vX.Y.Z); don't bump this.
version = "0"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = ["pytest>=9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
